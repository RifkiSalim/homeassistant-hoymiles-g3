# Register map derived from https://github.com/wasilukm/hoymiles_modbus
# Inverter index i: base = 4096 + i * 40 (0x1000 + i * 0x28)

modbus:
  - name: hoymiles_dtu
    type: tcp
    host: !secret hoymiles_host
    port: !secret hoymiles_port
    timeout: 5
    retries: 3
    sensors:
      # --- DTU serial @ 0x2000 (8192), 3 registers → 6 bytes hex ---
      - name: Hoymiles DTU serial raw 0
        unique_id: hoymiles_dtu_serial_reg0
        slave: !secret hoymiles_unit
        address: 8192
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: Hoymiles DTU serial raw 1
        unique_id: hoymiles_dtu_serial_reg1
        slave: !secret hoymiles_unit
        address: 8193
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: Hoymiles DTU serial raw 2
        unique_id: hoymiles_dtu_serial_reg2
        slave: !secret hoymiles_unit
        address: 8194
        input_type: holding
        data_type: uint16
        scan_interval: 300

      # --- Inverter 0 @ 0x1000 (4096) ---
      - name: Hoymiles inv0 data type
        unique_id: hoymiles_inv0_data_type
        slave: !secret hoymiles_unit
        address: 4096
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: Hoymiles inv0 serial reg0
        unique_id: hoymiles_inv0_serial_reg0
        slave: !secret hoymiles_unit
        address: 4096
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: Hoymiles inv0 serial reg1
        unique_id: hoymiles_inv0_serial_reg1
        slave: !secret hoymiles_unit
        address: 4097
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: Hoymiles inv0 serial reg2
        unique_id: hoymiles_inv0_serial_reg2
        slave: !secret hoymiles_unit
        address: 4098
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: Hoymiles inv0 port and serial reg3
        unique_id: hoymiles_inv0_serial_reg3
        slave: !secret hoymiles_unit
        address: 4099
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: Hoymiles inv0 PV voltage
        unique_id: hoymiles_inv0_pv_voltage
        slave: !secret hoymiles_unit
        address: 4100
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scan_interval: 10

      - name: Hoymiles inv0 PV current
        unique_id: hoymiles_inv0_pv_current
        slave: !secret hoymiles_unit
        address: 4101
        input_type: holding
        data_type: uint16
        scale: 0.01
        precision: 2
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        scan_interval: 10

      - name: Hoymiles inv0 grid voltage
        unique_id: hoymiles_inv0_grid_voltage
        slave: !secret hoymiles_unit
        address: 4102
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scan_interval: 10

      - name: Hoymiles inv0 grid frequency
        unique_id: hoymiles_inv0_grid_frequency
        slave: !secret hoymiles_unit
        address: 4103
        input_type: holding
        data_type: uint16
        scale: 0.01
        precision: 2
        unit_of_measurement: Hz
        state_class: measurement
        scan_interval: 10

      - name: Hoymiles inv0 PV power
        unique_id: hoymiles_inv0_pv_power
        slave: !secret hoymiles_unit
        address: 4104
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 10

      - name: Hoymiles inv0 today production
        unique_id: hoymiles_inv0_today_production
        slave: !secret hoymiles_unit
        address: 4105
        input_type: holding
        data_type: uint16
        unit_of_measurement: Wh
        device_class: energy
        state_class: total_increasing
        scan_interval: 60

      - name: Hoymiles inv0 total production
        unique_id: hoymiles_inv0_total_production
        slave: !secret hoymiles_unit
        address: 4106
        input_type: holding
        data_type: uint32
        unit_of_measurement: Wh
        device_class: energy
        state_class: total_increasing
        scan_interval: 60

      - name: Hoymiles inv0 temperature
        unique_id: hoymiles_inv0_temperature
        slave: !secret hoymiles_unit
        address: 4108
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: Hoymiles inv0 operating status
        unique_id: hoymiles_inv0_operating_status
        slave: !secret hoymiles_unit
        address: 4109
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: Hoymiles inv0 alarm code
        unique_id: hoymiles_inv0_alarm_code
        slave: !secret hoymiles_unit
        address: 4110
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: Hoymiles inv0 alarm count
        unique_id: hoymiles_inv0_alarm_count
        slave: !secret hoymiles_unit
        address: 4111
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: Hoymiles inv0 link and reserved
        unique_id: hoymiles_inv0_link_raw
        slave: !secret hoymiles_unit
        address: 4112
        input_type: holding
        data_type: uint16
        scan_interval: 10

template:
  - sensor:
      - name: Hoymiles DTU serial
        unique_id: hoymiles_dtu_serial
        icon: mdi:identifier
        state: >-
          {% set r0 = states('sensor.hoymiles_dtu_serial_raw_0') | int(0) %}
          {% set r1 = states('sensor.hoymiles_dtu_serial_raw_1') | int(0) %}
          {% set r2 = states('sensor.hoymiles_dtu_serial_raw_2') | int(0) %}
          {% set b0 = (r0 >> 8) & 0xFF %}
          {% set b1 = r0 & 0xFF %}
          {% set b2 = (r1 >> 8) & 0xFF %}
          {% set b3 = r1 & 0xFF %}
          {% set b4 = (r2 >> 8) & 0xFF %}
          {% set b5 = r2 & 0xFF %}
          {{ '%02x%02x%02x%02x%02x%02x' | format(b0, b1, b2, b3, b4, b5) }}

      - name: Hoymiles inv0 serial
        unique_id: hoymiles_inv0_serial
        icon: mdi:identifier
        state: >-
          {% set r0 = states('sensor.hoymiles_inv0_serial_reg0') | int(0) %}
          {% set r1 = states('sensor.hoymiles_inv0_serial_reg1') | int(0) %}
          {% set r2 = states('sensor.hoymiles_inv0_serial_reg2') | int(0) %}
          {% set r3 = states('sensor.hoymiles_inv0_port_and_serial_reg3') | int(0) %}
          {% set s0 = r0 & 0xFF %}
          {% set s1 = (r1 >> 8) & 0xFF %}
          {% set s2 = r1 & 0xFF %}
          {% set s3 = (r2 >> 8) & 0xFF %}
          {% set s4 = r2 & 0xFF %}
          {% set s5 = (r3 >> 8) & 0xFF %}
          {{ '%02x%02x%02x%02x%02x%02x' | format(s0, s1, s2, s3, s4, s5) }}

      - name: Hoymiles inv0 port number
        unique_id: hoymiles_inv0_port_number
        state: "{{ states('sensor.hoymiles_inv0_port_and_serial_reg3') | int(0) & 0xFF }}"

      - name: Hoymiles inv0 data type decoded
        unique_id: hoymiles_inv0_data_type_decoded
        state: "{{ states('sensor.hoymiles_inv0_data_type') | int(0) & 0xFF }}"

      - name: Hoymiles inv0 link status
        unique_id: hoymiles_inv0_link_status
        state: >-
          {{ (states('sensor.hoymiles_inv0_link_and_reserved') | int(0) >> 8) & 0xFF }}

      - name: Hoymiles plant PV power
        unique_id: hoymiles_plant_pv_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        state: >-
          {% set link = (states('sensor.hoymiles_inv0_link_and_reserved') | int(0) >> 8) & 0xFF %}
          {% if link == 1 %}
            {{ states('sensor.hoymiles_inv0_pv_power') | float(0) }}
          {% else %}
            0
          {% endif %}

      - name: Hoymiles plant today production
        unique_id: hoymiles_plant_today_production
        unit_of_measurement: Wh
        device_class: energy
        state_class: total_increasing
        icon: mdi:solar-power-variant
        state: >-
          {% set link = (states('sensor.hoymiles_inv0_link_and_reserved') | int(0) >> 8) & 0xFF %}
          {% if link == 1 %}
            {{ states('sensor.hoymiles_inv0_today_production') | int(0) }}
          {% else %}
            0
          {% endif %}

      - name: Hoymiles plant total production
        unique_id: hoymiles_plant_total_production
        unit_of_measurement: Wh
        device_class: energy
        state_class: total_increasing
        icon: mdi:counter
        state: >-
          {% set link = (states('sensor.hoymiles_inv0_link_and_reserved') | int(0) >> 8) & 0xFF %}
          {% if link == 1 %}
            {{ states('sensor.hoymiles_inv0_total_production') | int(0) }}
          {% else %}
            0
          {% endif %}

  - binary_sensor:
      - name: Hoymiles inv0 online
        unique_id: hoymiles_inv0_online
        device_class: connectivity
        state: >-
          {{ ((states('sensor.hoymiles_inv0_link_and_reserved') | int(0) >> 8) & 0xFF) == 1 }}

      - name: Hoymiles plant alarm
        unique_id: hoymiles_plant_alarm
        device_class: problem
        state: >-
          {{ states('sensor.hoymiles_inv0_alarm_code') | int(0) > 0 }}
