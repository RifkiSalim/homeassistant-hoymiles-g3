# Hoymiles G3 hybrid (HIS/HIT-xxL-G3) — native Modbus INPUT registers
# Connect: Home Assistant --Modbus TCP--> DTS/DTU stick Ethernet (port 502), NOT Wi-Fi.
# Register map: hoymiles-g3-modbus-tcp/registers.py (community, verified on HIT-15L-G3)
#
# Do not load packages/hoymiles_modbus.yaml (DTU-Pro 0x1000 holding map) on hybrids.

modbus:
  - name: hoymiles_gateway
    type: tcp
    host: !secret hoymiles_host
    port: !secret hoymiles_port
    timeout: 5
    retries: 3
    delay: 1
    sensors:
      - name: Hoymiles Work Status
        unique_id: hoymiles_g3_workstatus
        slave: !secret hoymiles_unit
        address: 0
        input_type: input
        data_type: uint16
        scan_interval: 10

      - name: Hoymiles Power DSP Firmware Version
        unique_id: hoymiles_g3_powerdsp_fm_ver
        slave: !secret hoymiles_unit
        address: 1
        input_type: input
        data_type: uint16
        scan_interval: 10

      - name: Hoymiles Software Fault
        unique_id: hoymiles_g3_sw_fault
        slave: !secret hoymiles_unit
        address: 19
        input_type: input
        data_type: uint32
        scan_interval: 10

      - name: Hoymiles Hardware Fault
        unique_id: hoymiles_g3_hw_fault
        slave: !secret hoymiles_unit
        address: 21
        input_type: input
        data_type: uint32
        scan_interval: 10

      - name: Hoymiles PV1 Voltage
        unique_id: hoymiles_g3_pv1_voltage
        slave: !secret hoymiles_unit
        address: 27
        input_type: input
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scan_interval: 10

      - name: Hoymiles PV1 Current
        unique_id: hoymiles_g3_pv1_current
        slave: !secret hoymiles_unit
        address: 28
        input_type: input
        data_type: int16
        scale: 0.01
        precision: 2
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scan_interval: 10

      - name: Hoymiles PV1 Power
        unique_id: hoymiles_g3_pv1_power
        slave: !secret hoymiles_unit
        address: 29
        input_type: input
        data_type: uint16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        scan_interval: 10

      - name: Hoymiles PV2 Voltage
        unique_id: hoymiles_g3_pv2_voltage
