title: Hoymiles G3
path: hoymiles-g3
icon: mdi:solar-power
cards:
  - type: markdown
    content: >
      G3 hybrid Modbus (input registers). Disable `hoymiles_modbus.yaml` if values were wrong.
  - type: glance
    title: Live
    entities:
      - entity: sensor.hoymiles_pv_total_power_computed
      - entity: sensor.hoymiles_grid_frequency
      - entity: sensor.hoymiles_battery_soc
      - entity: sensor.hoymiles_batt_power_bms
  - type: entities
    title: PV strings
    entities:
      - entity: sensor.hoymiles_pv1_voltage
      - entity: sensor.hoymiles_pv1_power
      - entity: sensor.hoymiles_pv2_voltage
      - entity: sensor.hoymiles_pv2_power
  - type: entities
    title: Grid & load
    entities:
      - entity: sensor.hoymiles_grid_voltage_a
      - entity: sensor.hoymiles_grid_active_power_total
      - entity: sensor.hoymiles_load_power_total
      - entity: sensor.hoymiles_meter_active_total
